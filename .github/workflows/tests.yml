name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-matrix:
    name: Python ${{ matrix.python-version }} / Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Release hygiene check
        run: python scripts/release_check.py
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Tests
        run: python -m pytest -ra

  platform-smoke:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -ra
      - name: Import package
        run: python -c "import loopgrid_mcp; print(loopgrid_mcp.__version__)"

  package-build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install -U pip build
      - name: Build wheel and sdist
        run: python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Verify installed package
        run: python -c "import loopgrid_mcp; assert loopgrid_mcp.__version__ == '0.1.0'; print('package OK')"
