[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopgrid-mcp"
version = "0.1.0"
description = "MCP server bridge for LoopGrid decision evidence infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Cybertechsoft"}
]
keywords = ["mcp", "model-context-protocol", "ai-agents", "evidence", "loopgrid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "mcp[cli]>=2,<3",
  "pytest>=8,<9",
  "build>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/loopgridio/loopgrid-mcp"
Repository = "https://github.com/loopgridio/loopgrid-mcp"
Issues = "https://github.com/loopgridio/loopgrid-mcp/issues"
LoopGrid = "https://github.com/cybertechsoft/loopgrid"

[project.scripts]
loopgrid-mcp = "loopgrid_mcp.server:main"
loopgrid-mcp-doctor = "loopgrid_mcp.doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
